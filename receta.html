<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receta · MangoIA</title>
  <meta name="description" content="Receta completa con ingredientes, materiales y procedimiento paso a paso." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="scanner-body receta-body">

  <header class="scanner-bar">
    <a href="scanner.html" class="back-link">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Volver al escáner
    </a>
    <p class="scanner-bar__title">MangoIA · Receta</p>
    <button id="themeToggle2" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">
      <svg id="iconSun2" viewBox="0 0 24 24" width="20" height="20"><path d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5 5 3.6 3.6M18.4 18.4 19.8 19.8M5 19l-1.4 1.4M18.4 5.6 19.8 4.2M12 8a4 4 0 100 8 4 4 0 000-8Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <svg id="iconMoon2" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path d="M21 12.8A9 9 0 1111.2 3 7.2 7.2 0 0021 12.8Z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="scanner-main receta-main">
    <div id="recetaContainer" class="card recipe-detail-page">
      <p class="receta-loading">Cargando receta…</p>
    </div>
  </main>

  <footer class="footer footer--scanner">
    <div class="footer__inner">
      <p class="footer__copy">© <span id="footerYear2">2026</span> Proyecto de Feria Científica · Clasificación Inteligente de la Maduración de los Mangos.</p>
      <a href="index.html" class="back-link back-link--footer">← Volver al inicio</a>
    </div>
  </footer>

  <script src="recetas-data.js"></script>
  <script src="recipe-render.js"></script>
  <script src="script.js"></script>
  <script>
    (function () {
      const contenedor = document.getElementById("recetaContainer");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const receta = id && window.RECETAS_DB ? window.RECETAS_DB[id] : null;

      if (!receta) {
        contenedor.innerHTML = `
          <div class="receta-not-found">
            <span>🥭❓</span>
            <h2>Receta no encontrada</h2>
            <p>El enlace o código QR no corresponde a ninguna receta disponible. Vuelve al escáner para analizar un mango y descubrir sus recetas sugeridas.</p>
            <a href="scanner.html" class="btn btn--primary">Ir al escáner</a>
          </div>
        `;
        return;
      }

      document.title = receta.titulo + " · MangoIA";
      contenedor.innerHTML = renderRecipeDetailHTML(receta);
      generarQRparaReceta(receta);
    })();
  </script>
</body>
</html>
